# Builds the website on every pull request, and deploys it to GitHub Pages on a push to main, when
# an SDK releases, or when run by hand.
#
# The site documents what each SDK's package registry serves, so the code samples, the Android and
# React Native API references and the change logs come from each SDK's latest release tag. A
# release in herald, herald-flutter, herald-ios, herald-kmp or herald-react-native triggers this
# workflow with `repository_dispatch`.
name: Docs

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [sdk-release]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Choose the releases
        id: releases
        run: |
          android=$(scripts/latest_release.sh https://github.com/MkhytarMkhoian/herald)
          flutter=$(scripts/latest_release.sh https://github.com/MkhytarMkhoian/herald-flutter)
          ios=$(scripts/latest_release.sh https://github.com/MkhytarMkhoian/herald-ios)
          kmp=$(scripts/latest_release.sh https://github.com/MkhytarMkhoian/herald-kmp)
          react_native=$(scripts/latest_release.sh \
            https://github.com/MkhytarMkhoian/herald-react-native)
          if [[ -z "$android" || -z "$flutter" || -z "$ios" || -z "$kmp" ||
            -z "$react_native" ]]; then
            echo "Every SDK needs a release tag. Android: '$android', Flutter: '$flutter'," \
              "iOS: '$ios', KMP: '$kmp', React Native: '$react_native'"
            exit 1
          fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "kmp=$kmp" >> "$GITHUB_OUTPUT"
          echo "react_native=$react_native" >> "$GITHUB_OUTPUT"
          echo "Android: $android, Flutter: $flutter, iOS: $ios, KMP: $kmp," \
            "React Native: $react_native"

      - uses: actions/checkout@v5
        with:
          repository: MkhytarMkhoian/herald
          ref: ${{ steps.releases.outputs.android }}
          path: build/herald

      - uses: actions/checkout@v5
        with:
          repository: MkhytarMkhoian/herald-flutter
          ref: ${{ steps.releases.outputs.flutter }}
          path: build/herald-flutter

      - uses: actions/checkout@v5
        with:
          repository: MkhytarMkhoian/herald-ios
          ref: ${{ steps.releases.outputs.ios }}
          path: build/herald-ios

      - uses: actions/checkout@v5
        with:
          repository: MkhytarMkhoian/herald-kmp
          ref: ${{ steps.releases.outputs.kmp }}
          path: build/herald-kmp

      - uses: actions/checkout@v5
        with:
          repository: MkhytarMkhoian/herald-react-native
          ref: ${{ steps.releases.outputs.react_native }}
          path: build/herald-react-native

      # For the React Native API reference, which TypeDoc builds.
      - uses: actions/setup-node@v5
        with:
          node-version-file: build/herald-react-native/.nvmrc
          cache: npm
          cache-dependency-path: build/herald-react-native/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Builds as the Android release's version, as its publish workflow does, so the API
      # reference's source links point at that tag.
      - name: Build the site
        env:
          ANDROID_TAG: ${{ steps.releases.outputs.android }}
        run: GRADLE_ARGS="-Pversion=${ANDROID_TAG#v}" scripts/build_docs.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
